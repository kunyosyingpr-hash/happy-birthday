<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Aunt BB 💛</title>

<style>
body{
margin:0;
font-family:Georgia, serif;
background:linear-gradient(#fffaf0,#fdeedc);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
}

.card{
background:white;
padding:50px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
max-width:600px;
}

h1{
color:#9c6b30;
font-size:50px;
margin-bottom:10px;
}

h2{
color:#555;
font-weight:normal;
}

button{
margin-top:30px;
padding:15px 35px;
font-size:20px;
border:none;
border-radius:30px;
background:#d9a441;
color:white;
cursor:pointer;
}

button:hover{
transform:scale(1.05);
}

</style>

</head>

<body>

<div class="card">

<h1>For Aunt BB 💛</h1>

<h2>Happy Birthday</h2>

<p>
This diary was made with love.
</p>

<button onclick="alert('Welcome to your birthday diary 💛')">
Open Diary
</button>

</div>

</body>
</html>
